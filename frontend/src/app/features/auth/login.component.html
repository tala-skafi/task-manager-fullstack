<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-1"><i class="bi bi-check2-square me-1"></i>Task Manager</h1>
      <p class="text-center text-muted mb-4">Sign in to your account</p>

      @if (errorMessage()) {
        <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input id="username" type="text" class="form-control" formControlName="username"
                 [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid">
          <div class="invalid-feedback">Username is required.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control" formControlName="password"
                 [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid">
          <div class="invalid-feedback">Password is required.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm me-1"></span>Signing in...
          } @else {
            Sign in
          }
        </button>
      </form>

      <div class="mt-4 small text-muted border-top pt-3">
        <div class="fw-semibold mb-1">Demo accounts</div>
        <div>Admin: <code>tala</code> / <code>admin123</code></div>
        <div>User: <code>yazeed</code> / <code>user123</code></div>
      </div>
    </div>
  </div>
</div>
