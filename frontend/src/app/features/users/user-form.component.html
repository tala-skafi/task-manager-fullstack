<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 page-title mb-0">{{ isEdit ? 'Edit User' : 'New User' }}</h1>
  <a routerLink="/users" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    @if (errorMessage()) {
      <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" formControlName="name"
               [class.is-invalid]="form.controls.name.touched && form.controls.name.invalid">
        <div class="invalid-feedback">Name is required.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" formControlName="username"
               [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid">
        <div class="invalid-feedback">Username is required (at least 3 characters).</div>
        @if (isEdit) {
          <div class="form-text">Username cannot be changed.</div>
        }
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email"
               [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid">
        <div class="invalid-feedback">A valid email is required.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" formControlName="password"
               [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
               [placeholder]="isEdit ? 'Leave blank to keep current password' : ''">
        <div class="invalid-feedback">{{ passwordHint }}</div>
        <div class="form-text">{{ passwordHint }}</div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Role</label>
          <select class="form-select" formControlName="role">
            <option value="USER">User</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Status</label>
          <select class="form-select" formControlName="status">
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        @if (saving()) { <span class="spinner-border spinner-border-sm me-1"></span> }
        {{ isEdit ? 'Save Changes' : 'Create User' }}
      </button>
    </form>
  </div>
</div>
