<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 page-title mb-0">Users</h1>
  <a routerLink="/users/new" class="btn btn-primary">
    <i class="bi bi-plus-lg me-1"></i>New User
  </a>
</div>

<div class="card shadow-sm mb-3">
  <div class="card-body">
    <div class="row g-2">
      <div class="col-md-6">
        <input type="text" class="form-control" placeholder="Search by name or username"
               [(ngModel)]="search" (input)="load()">
      </div>
      <div class="col-md-3">
        <select class="form-select" [(ngModel)]="role" (change)="load()">
          <option value="">All roles</option>
          <option value="ADMIN">Admin</option>
          <option value="USER">User</option>
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-select" [(ngModel)]="status" (change)="load()">
          <option value="">All statuses</option>
          <option value="ACTIVE">Active</option>
          <option value="INACTIVE">Inactive</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="card shadow-sm">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        @if (loading()) {
          <tr><td colspan="6" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm"></span></td></tr>
        } @else if (users().length === 0) {
          <tr><td colspan="6" class="text-center text-muted py-4">No users found.</td></tr>
        } @else {
          @for (user of users(); track user.id) {
            <tr>
              <td>{{ user.name }}</td>
              <td>{{ user.username }}</td>
              <td>{{ user.email }}</td>
              <td><span class="badge" [class.bg-primary]="user.role === 'ADMIN'" [class.bg-secondary]="user.role === 'USER'">{{ user.role }}</span></td>
              <td><span class="badge" [class.bg-success]="user.status === 'ACTIVE'" [class.bg-danger]="user.status === 'INACTIVE'">{{ user.status }}</span></td>
              <td class="text-end">
                <a [routerLink]="['/users', user.id, 'edit']" class="btn btn-sm btn-outline-secondary me-1">
                  <i class="bi bi-pencil"></i>
                </a>
                <button class="btn btn-sm btn-outline-danger" (click)="delete(user)">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          }
        }
      </tbody>
    </table>
  </div>
</div>
