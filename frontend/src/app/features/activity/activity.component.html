<h1 class="h3 page-title mb-4">Activity Log</h1>

<div class="card shadow-sm">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th>Time</th>
          <th>User</th>
          <th>Action</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody>
        @if (loading()) {
          <tr><td colspan="4" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm"></span></td></tr>
        } @else if (logs().length === 0) {
          <tr><td colspan="4" class="text-center text-muted py-4">No activity recorded yet.</td></tr>
        } @else {
          @for (log of logs(); track log.id) {
            <tr>
              <td class="text-nowrap">{{ log.createdAt | date:'medium' }}</td>
              <td>{{ log.userName }}</td>
              <td><span class="badge bg-secondary">{{ log.action }}</span></td>
              <td>{{ log.details }}</td>
            </tr>
          }
        }
      </tbody>
    </table>
  </div>
</div>
