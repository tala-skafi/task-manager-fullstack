<a class="nav-link position-relative" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
  <i class="bi bi-bell"></i>
  @if (unreadCount() > 0) {
    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
      {{ unreadCount() }}
    </span>
  }
</a>

<div class="dropdown-menu dropdown-menu-end shadow" style="width: 320px; max-height: 400px; overflow-y: auto;">
  <div class="d-flex justify-content-between align-items-center px-3 py-2">
    <span class="fw-semibold">Notifications</span>
    @if (unreadCount() > 0) {
      <button class="btn btn-link btn-sm p-0 text-decoration-none" (click)="markAllRead()">Mark all read</button>
    }
  </div>
  <div class="dropdown-divider m-0"></div>

  @if (notifications().length === 0) {
    <div class="px-3 py-3 text-muted small text-center">No notifications</div>
  } @else {
    @for (n of notifications(); track n.id) {
      <button type="button" class="dropdown-item d-flex flex-column align-items-start py-2"
              [class.bg-light]="!n.read" (click)="onClick(n)">
        <span class="small text-wrap" [class.fw-semibold]="!n.read">{{ n.message }}</span>
        <span class="text-muted" style="font-size: .75rem;">{{ n.createdAt | date:'short' }}</span>
      </button>
    }
  }
</div>
